name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: Snare-Windows
          - os: ubuntu-latest
            artifact_name: Snare-Linux
          - os: macos-latest
            artifact_name: Snare-MacOS

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller Pillow
          pip install .[dev]

      - name: Build with PyInstaller
        shell: bash
        run: |
          pyinstaller --noconfirm --onefile --windowed \
            --name Snare \
            --icon "src/desktop_sniffer/assets/icon.ico" \
            --add-data "src/desktop_sniffer:desktop_sniffer" \
            --exclude-module PySide6.QtQml \
            --exclude-module PySide6.QtQuick \
            --exclude-module PySide6.QtPdf \
            --exclude-module PySide6.QtOpenGL \
            --exclude-module PySide6.QtVirtualKeyboard \
            src/desktop_sniffer/app.py

      - name: Package for Windows
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          cd dist
          mv Snare.exe ../Snare-Windows.exe

      - name: Package for Linux
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          cd dist
          mv Snare ../Snare-Linux
          # deb paket yaratish uchun vaqtincha papkaga joylaymiz
          mkdir -p snare-deb/usr/bin
          cp ../Snare-Linux snare-deb/usr/bin/snare
          chmod +x snare-deb/usr/bin/snare
          sudo gem install fpm
          fpm -s dir -t deb -n snare -v 1.0.0 -a amd64 -C snare-deb .
          mv *.deb ../

      - name: Package for MacOS
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          cd dist
          zip -ry ../Snare-MacOS.zip Snare.app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            Snare-Windows.exe
            Snare-Linux
            Snare-*.zip
            *.deb

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/Snare-Linux
            artifacts/**/*.zip
            artifacts/**/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
