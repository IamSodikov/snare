name: Windows review build
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux Qt runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - name: Dependencies
        run: python -m pip install -e '.[dev]'
      - name: Unit and UI regressions
        run: python -m pytest -q --basetemp=test-temp
      - name: Lint
        run: python -m ruff check --isolated --select E4,E7,E9,F src tests scripts
      - name: UI and real proxy smoke
        run: python -m desktop_sniffer --smoke-test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.os }}
          path: smoke-result.json
  windows:
    needs: tests
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]' pyinstaller==6.22.3
      - name: Build Windows executable
        run: python scripts/build_windows.py
      - name: Run packaged smoke test
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath (Resolve-Path dist/Snare-Windows.exe) -ArgumentList '--smoke-test' -PassThru -Wait
          if ($proc.ExitCode -ne 0) { throw "Packaged smoke failed: $($proc.ExitCode)" }
          Get-Content smoke-result.json
      - name: Package
        shell: pwsh
        run: |
          Copy-Item smoke-result.json dist/smoke-result.json
          Compress-Archive -Path dist/Snare-Windows.exe,dist/SHA256SUMS,dist/BUILD-INFO.json,dist/README.txt,dist/smoke-result.json -DestinationPath Snare-Windows-review.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Snare-Windows-review
          path: Snare-Windows-review.zip
          retention-days: 30
