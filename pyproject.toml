[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "snare"
version = "0.1.0"
description = "Cross-platform desktop HTTP/HTTPS sniffer and API mock debugger"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Mukhammadaziz" }
]
urls = { "Homepage" = "https://github.com/IamSodikov/snare", "Repository" = "https://github.com/IamSodikov/snare.git" }
keywords = ["snare", "http-sniffer", "mitmproxy", "pyside6", "mock-server", "network-inspector", "reverse-proxy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Networking :: Monitoring",
]

dependencies = [
    "PySide6>=6.8,<7",
    "mitmproxy>=12,<13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.9,<1",
]

[project.gui-scripts]
snare = "desktop_sniffer.app:main"
desktop-sniffer = "desktop_sniffer.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
